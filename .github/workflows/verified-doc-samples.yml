name: Verified documentation samples

on:
  pull_request:
    paths:
      - "docs/**"
      - "examples/verified-doc-samples/**"
      - "scripts/verify-doc-samples.*"
      - "scripts/validate-docs-structure.js"
      - "scripts/check-terminology.js"
      - ".github/workflows/verified-doc-samples.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"

      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.24.1"

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Base Foundry
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        run: |
          curl -L https://raw.githubusercontent.com/base/base-anvil/HEAD/foundryup/install | bash
          "$FOUNDRY_DIR/bin/base-foundryup" --install v1.1.1
          echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"

      - name: Verify published samples
        run: PATH="$FOUNDRY_DIR/bin:$PATH" scripts/verify-doc-samples.sh
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
