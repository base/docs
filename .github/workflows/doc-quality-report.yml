# Weekly, non-blocking pipeline metrics for the base-std docs sync bot
# (scripts/sync-from-base-std/, see scripts/doc-evals/PLAN.md Lane C).
#
# Scores nothing and blocks nothing: no pull_request trigger, and the only
# GitHub write this workflow makes is create-or-update on a single tracking
# issue titled "Docs sync quality report" (found by exact title match, so a
# re-run edits the same issue instead of piling up duplicates).
#
# Hardening follows this repo's existing pattern exactly (see
# docs-style-conformance.yml and base-std-docs-sync.yml): pinned
# step-security/harden-runner, pinned checkout/setup-node SHAs, top-level
# `permissions: {}` with the job requesting only what it needs, and no
# `${{ github.event.* }}` interpolated into a `run:` block — the run step
# below only reads plain env vars it set itself.

name: Docs sync quality report

on:
  schedule:
    - cron: "0 13 * * 1" # Monday 13:00 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: doc-quality-report
  cancel-in-progress: false

jobs:
  report:
    name: Docs sync quality report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"

      - name: Install script dependencies
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Generate and post the quality report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          node scripts/doc-evals/metrics/report.mjs --owner "$REPORT_OWNER" --repo "$repo_name"
