name: Vibenet AA vendor integrity

on:
  pull_request:
    paths:
      - "docs/static/aa.txt"
      - "docs/static/aa.meta.json"
      - "docs/static/vibenet-engine.txt"
      - "docs/snippets/StablecoinDemo.jsx"
      - "docs/snippets/AssetDemo.jsx"
      - "scripts/test-vibenet-engine.mjs"
      - ".github/workflows/vibenet-aa-vendor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"

      - name: Rebuild pinned AA artifact
        shell: bash
        run: |
          set -euo pipefail
          commit=$(jq -r .base_ui_commit docs/static/aa.meta.json)
          path=$(jq -r .source_path docs/static/aa.meta.json)
          source_sha=$(jq -r .source_sha256 docs/static/aa.meta.json)
          artifact_sha=$(jq -r .artifact_sha256 docs/static/aa.meta.json)

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/base/ui/${commit}/${path}" \
            --output /tmp/base-ui-aa.js

          printf '%s  %s\n' "$source_sha" /tmp/base-ui-aa.js | sha256sum --check --strict
          npx --yes esbuild@0.25.9 /tmp/base-ui-aa.js \
            --minify \
            --format=esm \
            --target=es2022 \
            --legal-comments=none \
            --outfile=/tmp/aa.txt
          printf '%s  %s\n' "$artifact_sha" /tmp/aa.txt | sha256sum --check --strict
          cmp --silent /tmp/aa.txt docs/static/aa.txt

      - name: Test the shared engine and snippet loader
        run: node scripts/test-vibenet-engine.mjs
