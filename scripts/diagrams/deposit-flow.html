<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Deposit flow</title>
  </head>
  <body>
    <div class="diagram" id="diagram">
      <!-- Participant headers -->
      <div class="headers">
        <div class="pill" style="left: 140px">User</div>
        <div class="pill" style="left: 512px">Ledger</div>
        <div class="pill" style="left: 884px">Portal</div>
      </div>

      <!-- Sequence body -->
      <div class="body" style="height: 268px">
        <!-- Section bands (alternating gray-5) -->
        <div class="band" style="top: 0; height: 96px"></div>
        <div class="band gray" style="top: 96px; height: 60px"></div>
        <div class="band" style="top: 156px; height: 112px"></div>

        <!-- Lifelines -->
        <div class="lifeline" style="left: 140px"></div>
        <div class="lifeline" style="left: 512px"></div>
        <div class="lifeline" style="left: 884px"></div>

        <!-- Section labels -->
        <div class="section-label" style="top: 42px">Prepare</div>
        <div class="section-label" style="top: 120px">Deposit</div>
        <div class="section-label" style="top: 206px">Credit</div>

        <!-- PREPARE: User -> Ledger (blue, forward) -->
        <div class="arrow blue" style="left: 140px; width: 372px; top: 40px">
          <span class="label">encrypt recipient</span>
          <div class="line"></div>
          <div class="head right"></div>
        </div>
        <!-- PREPARE: Ledger -> User (gray, return) -->
        <div class="arrow gray" style="left: 140px; width: 372px; top: 72px">
          <span class="label">encrypted recipient</span>
          <div class="line"></div>
          <div class="head left"></div>
        </div>

        <!-- DEPOSIT: User -> Portal (blue, forward) -->
        <div class="arrow blue" style="left: 140px; width: 744px; top: 126px">
          <span class="label">deposit(encrypted recipient, amount)</span>
          <div class="line"></div>
          <div class="head right"></div>
        </div>

        <!-- CREDIT: Portal -> Ledger (gray, return) -->
        <div class="arrow gray" style="left: 512px; width: 372px; top: 188px">
          <span class="label">Deposit event</span>
          <div class="line"></div>
          <div class="head left"></div>
        </div>

        <!-- CREDIT: card under Ledger -->
        <div class="card" style="left: 512px; top: 210px">
          <div class="title">Decrypt &amp; Credit</div>
          <div class="sub">credit the ledger</div>
        </div>
      </div>
    </div>
  </body>
</html>
