<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Withdraw flow</title>
  </head>
  <body>
    <div class="diagram" id="diagram">
      <!-- Participant headers -->
      <div class="headers">
        <div class="pill" style="left: 140px">User</div>
        <div class="pill" style="left: 512px">Ledger</div>
        <div class="pill" style="left: 884px">Base</div>
      </div>

      <!-- Sequence body -->
      <div class="body" style="height: 268px">
        <!-- Section bands (alternating gray-5) -->
        <div class="band" style="top: 0; height: 150px"></div>
        <div class="band gray" style="top: 150px; height: 118px"></div>

        <!-- Lifelines -->
        <div class="lifeline" style="left: 140px"></div>
        <div class="lifeline" style="left: 512px"></div>
        <div class="lifeline" style="left: 884px"></div>

        <!-- Section labels -->
        <div class="section-label" style="top: 24px">Prepare</div>
        <div class="section-label" style="top: 176px">Withdraw</div>

        <!-- PREPARE: User -> Ledger (blue, forward) -->
        <div class="arrow blue" style="left: 140px; width: 372px; top: 32px">
          <span class="label">request withdraw auth</span>
          <div class="line"></div>
          <div class="head right"></div>
        </div>

        <!-- PREPARE: card under Ledger -->
        <div class="card" style="left: 512px; top: 56px">
          <div class="title">Operator-signed</div>
          <div class="sub">withdraw authorization</div>
        </div>

        <!-- PREPARE: Ledger -> User (gray, return) -->
        <div class="arrow gray" style="left: 140px; width: 372px; top: 124px">
          <span class="label">authorization</span>
          <div class="line"></div>
          <div class="head left"></div>
        </div>

        <!-- WITHDRAW: User -> Base (blue, forward) -->
        <div class="arrow blue" style="left: 140px; width: 744px; top: 186px">
          <span class="label">withdraw(authorization, asset, amount)</span>
          <div class="line"></div>
          <div class="head right"></div>
        </div>

        <!-- WITHDRAW: chip near Base -->
        <div class="card chip" style="left: 838px; top: 214px">
          <div class="title">Release funds &middot; compose with Base actions</div>
        </div>
      </div>
    </div>
  </body>
</html>
